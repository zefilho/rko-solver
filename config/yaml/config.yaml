# Configuração de Meta-heurísticas para RKO
# Cada meta-heurística listada será executada em uma thread separada
metaheuristics:
  - SA
  - ILS
  - VNS
  - BRKGA
  - BRKGA-CS
  - PSO
  - GA
  - LNS
  - GRASP
  - IPR

# Configurações Gerais de Execução
execution_settings:
  max_runs: 1      # Número máximo de execuções
  debug_mode: 0        # 0: teste, 1: debug
  control_mode: 1      # 0: offline tuning, 1: Q-Learning (online)

# Parâmetros de Algoritmo e Busca
search_parameters:
  local_search_strategy: 1  # 1: first improvement, 2: best improvement
  restart_threshold: 1      # % do tempo máximo para disparar o restart
  elite_pool_size: 10       # Tamanho do pool de soluções de elite

# Se o problema carregado for multi-objetivo, qual técnica usar?
# Opções: "Tchebycheff", "WeightedSum", "Gini_Coefficient"
scalarization: "Tchebycheff"

# Pesos padrão (caso o algoritmo não forneça dinamicamente)
default_weights: [0.00, 1.00]

# Ponto de Referência Ideal a priori (opcional - se omitido, calcula dinamicamente)
#ideal_point: [-110.0, 40.0]

# Ponto de Referência Nadir a priori (opcional - se omitido, calcula dinamicamente)
# nadir_point: [0.0, 100.0]

# Manter Ponto Ideal fixado na busca (true/false)
fixed_ideal_point: false

# Método de atualização do pool: 0 = Padrão (CP), 1 = NSGA-II
poolUpdateMethod: 0