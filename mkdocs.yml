site_name: RKOSolver
site_description: Random-Key Optimizer Framework with Modern C++20 Dynamic Plugin Architecture
site_url: https://docs.rkosolver.github.io
repo_url: https://github.com/zefilho/rko-solver
repo_name: zefilho/rko-solver

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Algorithms & Control: algorithms.md
  - Metaheuristics Catalog: metaheuristics.md
  - API Reference: reference.md
