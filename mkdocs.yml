site_name: RKOSolver
site_description: Random-Key Optimizer Framework with Modern C++20 Dynamic Plugin Architecture
site_url: https://docs.rkosolver.github.io
repo_url: https://github.com/zefilho/rko-solver
repo_name: zefilho/rko-solver

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference: reference.md